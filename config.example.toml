# Пример конфигурации sa-home-bot.
# Скопируйте в config.toml и подставьте свои значения.
# Любое значение можно переопределить переменной окружения с префиксом
# SENTINEL__ и разделителем вложенности "__", например:
#   SENTINEL__TELEGRAM__TOKEN=123:abc
# Подписки задаются ТОЛЬКО в TOML.
#
# Пути ниже (database.path, socket, db_path) показаны относительными для
# краткости — они резолвятся от WorkingDirectory процесса. Если конфиг и
# данные живут в разных каталогах (конфиг в ~/.config/, данные в
# ~/.local/share/ — обычная раскладка pip/pipx-установки), держите пути
# АБСОЛЮТНЫМИ, иначе легко разъехаться (грабли 2026-07-11).

# [telegram], [weather], [[subscriptions]] и [[people]] относятся к КОНКРЕТНОМУ
# боту. Если бот назначен ноде с инстансом (telegram-bot@alfred — так нужно,
# когда у него есть резервная нода), эти секции переезжают в пакет
# instances/telegram-bot.alfred.toml рядом с этим файлом: пакет реплицируется
# по рою, и резерв всегда держит те же настройки, что активная нода. Оставшаяся
# здесь копия проиграет пакету, и загрузка предупредит об этом в логе.
[telegram]
token = "PUT-YOUR-BOT-TOKEN-HERE"

[database]
path = "./data/sentinel.sqlite"

[schedule]
scan_cron = "*/1 * * * *"          # снимать температуру датчиков раз в минуту
smart_cron = "0 * * * *"           # снимок SMART-счётчиков дисков раз в час
housekeeping_cron = "0 3 * * *"    # уборка ночью

[sensors.cpu]
enabled = true
warn_c = 80.0
crit_c = 90.0
hysteresis_delta_c = 5.0            # обратно в ok при temp < warn - delta
consecutive_to_alert = 3
consecutive_to_clear = 3
# Политика порогов: "fixed" (по умолчанию) — жёсткие warn/crit выше.
# "baseline" — адаптивный порог: копит историю показаний в БД и алертит на
# аномальное отклонение вверх. Порог = min(warn_c, mean + k_sigma*max(std, min_std)),
# то есть baseline только опускает порог (ловит перегрев раньше на холодной машине),
# warn_c остаётся верхней страховкой. Пока накоплено < baseline_min_samples — fixed.
mode = "fixed"                      # fixed | baseline
baseline_window = 240              # сколько последних показаний брать в статистику
baseline_min_samples = 30          # минимум истории, иначе холодный старт (fixed)
baseline_k_sigma = 4.0             # порог = mean + k_sigma * std
baseline_min_std_c = 3.0           # нижняя граница std (защита от слишком узкого окна)

[sensors.gpu]
# По умолчанию выключен — в отличие от cpu/disks, GPU есть не у каждой ноды
# (на 2026-08 — только mycraft: Tesla V100 SXM2 + RTX 3060). Источник —
# `nvidia-smi` (hwmon не публикует температуру с проприетарным драйвером
# NVIDIA), опрашивает сразу все карты на машине одним вызовом.
enabled = false
warn_c = 80.0
crit_c = 90.0
hysteresis_delta_c = 5.0
consecutive_to_alert = 3
consecutive_to_clear = 3
mode = "fixed"                      # fixed | baseline (см. [sensors.cpu])
baseline_window = 240
baseline_min_samples = 30
baseline_k_sigma = 4.0
baseline_min_std_c = 3.0

[sensors.disks]
enabled = true
warn_c = 55.0
crit_c = 65.0
hysteresis_delta_c = 5.0
consecutive_to_alert = 2
consecutive_to_clear = 2
mode = "fixed"                      # fixed | baseline (см. [sensors.cpu])
baseline_window = 240
baseline_min_samples = 30
baseline_k_sigma = 4.0
baseline_min_std_c = 3.0
# Пусто = автоопределение через `smartctl --scan` (тип адаптера -d берётся оттуда).
# Можно задать вручную "устройство:тип", если автоскан определяет тип неверно —
# например USB-мост JMicron без -d отдаёт temperature: null:
#   devices = ["/dev/sda:sntjmicron", "/dev/sdb:sat"]
# eMMC (/dev/mmcblk*) и подобные без SMART пропускаются автоматически.
devices = []

# [sensors.lhm] — только для Windows-ноды: температуры CPU/дисков читаются
# через LibreHardwareMonitorLib.dll (pythonnet). На Linux секция игнорируется.
# Полный пример Windows-конфига — deploy/config-windows.example.toml.
#[sensors.lhm]
#dll_path = ""                      # пусто = автопоиск типовых мест

# Служба monitor (отдельный процесс: `sa-home-bot --service monitor`).
# Бот общается с ней по протоколу v0 (см. PROTOCOL.md). socket — endpoint:
# unix-путь (Linux) или "tcp://127.0.0.1:8711" (Windows; требует [swarm].token).
# У монитора СВОЯ БД — [database].path остаётся боту.
[monitor]
socket = "./data/monitor.sock"
db_path = "./data/monitor.sqlite"

# Служба apps (адаптер приложений: `sa-home-bot --service apps`) — умения роя
# поверх готового софта (торрент-клиент, медиасервер): по протоколу отвечает
# состоянием systemd-юнита и ссылками на веб-морду. Каждое приложение — скилл
# первого уровня в /skills; право в подписке — "<id>@apps".
[apps]
socket = "./data/apps.sock"

[[apps.items]]
id = "qbittorrent"
title = "🧲 qBittorrent"
unit = "qbittorrent-nox.service"   # системный systemd-юнит
urls = ["http://192.168.0.100:8080"]

[[apps.items]]
id = "jellyfin"
title = "🎬 Jellyfin"
unit = "jellyfin.service"
urls = ["http://192.168.0.100:8096"]

# Служба torrents (адаптер qBittorrent, `sa-home-bot --service torrents`):
# умение роя «добавить торрент по .torrent-файлу/magnet-ссылке из чата»
# (в отличие от apps выше — реальный Web API, не только systemd-статус).
# save_dirs — конечный список директорий; бот предложит их кнопками, право
# в подписке — "add@torrents". Отдельно "list@torrents" — read-only «что
# качается» (им же гейтится swarm_status(what="torrents") у Альфреда).
# qbittorrent_password — секрет, не коммитить.
[torrents]
socket = "./data/torrents.sock"
qbittorrent_url = "http://127.0.0.1:8080"
qbittorrent_user = "sevboa"
qbittorrent_password = ""
save_dirs = [
    "/mnt/data/torrents/complete",
    "/mnt/data/pr",
    "/mnt/scratch/torrents/complete",
    "/mnt/scratch/pr",
]
# Поиск по трекерам (действие `search`) — встроенный движок qBittorrent и его
# плагины; ставятся в самом qBittorrent («Поиск» → «Поисковые плагины»), логин
# к трекеру настраивается в файле плагина. Путь ниже нужен службе, чтобы качать
# метафайлы руками плагина (`nova2dl.py`) — с трекеров под логином иначе
# приходит страница входа. Пусто = `~/.local/share/qBittorrent/nova3`.
# search_engine_dir = ""

# Служба llm (Альфред, `sa-home-bot --service llm`) — на GPU-ноде Windows
# (winpc, container_backend="wsl-docker") или на постоянной Linux-ноде с
# нативной Ollama (mycraft, container_backend="native", CPU-only — с
# 2026-08-02). Секция описывается в схеме статично, иначе --check-config на
# других нодах не увидит поля. ollama_url — loopback-адрес Ollama на ТОЙ ЖЕ
# машине, наружу не смотрит (LLM_INTEGRATION_PLAN.md §0).
# request_timeout_s — таймаут ask/chat по протоколу роя (генерация с холодным
# стартом WSL/контейнера/загрузки модели дольше типичных «быстрых» действий).
# idle_sleep_after_s — после стольки секунд без запросов служба усыпляет
# модель (wsl-docker — гасит контейнер целиком; native — явный keep_alive=0
# Ollama, сам процесс не трогается); право в подписке — "chat@llm".
# think_chat — thinking-режим qwen3 для chat (не для ask — там не нужен):
# заметно дольше (~30-40с на раунд), но без него модель на реальных задачах
# с формулами путается в арифметике и не всегда зовёт calc — точность того
# стоит (LLM_INTEGRATION_PLAN.md, живая находка 2026-07-24).
#
# container_backend — "wsl-docker" (дефолт, только Windows: служба сама
# поднимает/гасит WSL2+Docker через wsl.exe) или "native" (Linux: Ollama —
# systemd-сервис, always-on, служба её не стартует/не гасит, только просит
# выгрузить модель). wsl_distro/ollama_container нужны только "wsl-docker".
[llm]
socket = "./data/llm.sock"
container_backend = "wsl-docker"       # "wsl-docker" (Windows) | "native" (Linux)
ollama_url = "http://127.0.0.1:11434"
model = "qwen3:14b"
wsl_distro = "Docker"
ollama_container = "ollama"
request_timeout_s = 240.0
# Сколько ждать ПРОГРЕВА модели, прежде чем счесть службу неготовой (это
# отдельная от request_timeout_s величина: платится за холодный старт).
# Замер 2026-07-30: 35B-модель поднимается с диска ~200 с, при прежних 180 с
# отложенные задачи проваливались, хотя модель успевала загрузиться.
warmup_timeout_s = 360.0
idle_sleep_after_s = 1800.0
think_chat = true
# Режим request_alfred: "router_think" (дефолт) — лёгкий router-проход
# решает, нужно ли думать, затем персонажный проход с уже известным think.
# "single_call" — для моделей без поддержки thinking (например, некоторые
# gemma-сборки на Ollama отвечают 400 "does not support thinking" на любой
# think=true) — один персонажный проход сразу, без router и без think.
mode = "router_think"
# Логопед: состояние вероятностной, излечимой картавости Альфреда
# (llm/speech_therapy.py) — вероятность искажения, счётчик коррекций,
# исключённые слова.
speech_therapy_state_path = "./data/speech-therapy-state.json"
# Chat_id, где картавость закреплена на 100% навсегда, независимо от
# общего прогресса лечения (можно оставить пустым).
speech_therapy_pinned_chat_ids = []

# Текст персонажа — намеренно НЕ в этом файле и не в config.toml: слишком
# личный/объёмный, чтобы жить среди обычных настроек. Заполняется отдельным
# локальным файлом llm-prompt.toml РЯДОМ с config.toml (тот же каталог) —
# см. шаблон llm-prompt.example.toml в корне репозитория. Оба файла
# gitignored. Если llm-prompt.toml нет — служба llm подставит безликую
# заглушку (llm/prompt.py::DEFAULT_PERSONA_PROMPT) и запишет warning в лог.

# Город дома для тула get_weather (/ai) — не отдельная служба, вызов делает
# сам бот (Open-Meteo, без ключа). Координаты по названию города тул
# получает сам через геокодинг-API того же провайдера при первом запросе и
# кэширует — искать/вписывать широту-долготу руками не нужно. Пусто по
# умолчанию — тул явно откажет, не покажет погоду не пойми где.
[weather]
city = ""

# Служба tasks (`sa-home-bot --service tasks`) — отложенные задачи роя: тул
# remind ставит «спросить нейронку ещё раз в момент X», служба будит цель
# заранее и прогоняет диалог через llm.chat в срок. db_path — своя БД, не БД
# бота (доступа к диалогам и Telegram у службы нет).
# Служба memory (`sa-home-bot --service memory`) — долгая память Альфреда о
# чате (AUTHORIZATION.md §3.4, memory/service.py). family_chat_ids — список
# chat_id, которым доступен scope="family": факт, записанный из ЛЮБОГО из
# этих чатов, виден во ВСЕХ них (но не случайному гостю по инвайту, как
# scope="common"). Правьте руками — сюда идут id владельца и родных.
[memory]
socket = "./data/memory.sock"
db_path = "./data/memory.sqlite"
family_chat_ids = []

[tasks]
socket = "./data/tasks.sock"
db_path = "./data/tasks.sqlite"

# Служба net (`sa-home-bot --service net`) — веб-поиск для /ai через СВОЙ
# SearXNG (LLM_INTEGRATION_PLAN.md §9). Право в подписке — "search@net".
# Сам SearXNG ставится на ноду отдельно (venv + uWSGI под systemd, слушает
# только localhost) — его удобно завести как [[apps.items]] выше, чтобы
# управлять службой apps. ВАЖНО: в settings.yml SearXNG формат json выключен
# по умолчанию — включить явно, иначе сюда прилетит HTML вместо JSON.
# Redis не нужен: limiter при localhost-биндинге не требуется, а лишние
# постоянные записи на eMMC ради кэша не нужны.
[net]
socket = "./data/net.sock"
searxng_url = "http://127.0.0.1:8888"
request_timeout_s = 20.0
probe_timeout_s = 5.0
max_results = 5
language = "ru"

# Служба vpn (`sa-home-bot --service vpn`) — AmneziaWG-доступ на jeeves
# (единственная нода с белым IP; Этап 33 IMPLEMENTATION_PLAN.md). Интерфейс
# и подсеть поднимает ops-скрипт deploy/setup-awg-jeeves.sh, служба только
# управляет пирами через `awg` под узким sudoers (nodectl fix ставит его
# сам — см. node/fixups.py::AWG_SUDOERS). jc/jmin/jmax/s1/s2/h1-h4 —
# параметры обфускации: ОБЯЗАНЫ дословно совпадать с тем, что реально
# прописано в серверном /etc/amnezia/amneziawg/awg0.conf — подбираются один
# раз при установке, значения ниже — только пример, не копировать вслепую.
# endpoint_host — белый IP jeeves (нужен для рендера клиентского конфига).
# base_quota_gb/extra_step_gb/self_ceiling_gb/warn_remaining_gb — решения
# пользователя 2026-08-03: база 500 ГБ/мес, гость сам добавляет по 100 ГБ,
# пока сумма не достигла 1 ТБ (self_ceiling_gb), дальше — заявка админу.
# warn_remaining_gb — двойная роль: и порог предупреждения, и порог, ниже
# которого вообще открыто самообслуживание («+100 ГБ» без подтверждения
# админа) — 100 ГБ. node_limit_gb — лимит канала VDS по тарифу (сообщено
# пользователем: 10 ТБ/мес) — при приближении алерт уходит админам, гостей
# не касается. Число устройств на гостя не ограничено — стоимость и так
# упирается в трафик.
[vpn]
socket = "./data/vpn.sock"
db_path = "./data/vpn.sqlite"
interface = "awg0"
subnet = "10.9.0.0/24"
endpoint_host = ""
endpoint_port = 51820
dns = "1.1.1.1"
jc = 5
jmin = 40
jmax = 70
s1 = 50
s2 = 80
h1 = 5
h2 = 6
h3 = 7
h4 = 8
base_quota_gb = 500
extra_step_gb = 100
self_ceiling_gb = 1000
warn_remaining_gb = 100
node_limit_gb = 10000
sample_interval_s = 180.0
apk_repo = "amnezia-vpn/amneziawg-android"
apk_cache_dir = "./data/vpn-apk"
ios_app_store_url = "https://apps.apple.com/app/amneziawg/id6478942365"
google_play_url = "https://play.google.com/store/apps/details?id=org.amnezia.awg"
official_download_url = "https://amnezia.org/downloads"
config_message_ttl_s = 600.0

# Сервис ноды (супервизор: `sa-home-bot --service node`, консоль — nodectl).
# Нода запускает назначенные службы дочерними процессами и рестартит упавшие.
# id — имя ноды в рое (пусто = hostname). Умения питания (poweroff/reboot/
# suspend) объявляются в describe автоматически; в боте право — "<...>@node".
# listen — адрес (или список адресов) для пиров роя: unix-сокет остаётся
# локальным фронтендам, tcp — межнодовому каналу, нода слушает всё сразу.
# Одного tailscale-адреса мало: он появляется через 40-60 с после загрузки, а
# без интернета не появляется вовсе — и две машины в одной комнате друг друга
# не видят, хотя LAN исправна. Домашней ноде за NAT проще всего дать
# "tcp://0.0.0.0:8710": адреса интерфейсов подставятся сами и переживут смену
# IP по DHCP. Машине с публичным адресом (VDS) так делать НЕ надо — там порт
# роя уедет в интернет; ей перечислите адреса явно. Адрес, которого ещё нет,
# старт не задерживает — нода добирает его фоном.
# Соседям нода сама рассказывает все свои адреса (в hello), поэтому в
# [[swarm.nodes]] достаточно одного, по которому она найдётся впервые:
# перечислять чужие адреса руками не нужно.
# assignments — стартовый набор; assign/unassign по протоколу (nodectl/бот,
# право assign@node/unassign@node) меняют его в рантайме без правки конфига
# и без рестарта ноды — фактический список хранится в state_path, переживает
# рестарт (TOML остаётся минимумом, снять его назначение можно только правкой).
#
# kind — тип машины: "server" (домашний сервер, 24/7, реальное железо),
# "workstation" (ПК/ноутбук: спит и выключается — это норма, будится по WoL),
# "vps" (виртуалка: 24/7, но термозон и SMART нет). Не делает ноду главной —
# рой равноправен; определяет, алертить ли о её пропаже (node_down),
# предлагать ли ей монитор, применим ли WoL и каков базовый приоритет в
# аренде служб-синглтонов. По умолчанию "workstation" (консервативно молчит):
# серверу и VDS тип обязательно задавать явно, иначе рой не заметит их пропажу.
#
# assignments могут нести роль и инстанс:
#   "monitor"                       — как раньше;
#   "telegram-bot@alfred"           — активный экземпляр бота «alfred»;
#   "telegram-bot@alfred:standby"   — тот же бот в резерве (запустится, только
#                                     если активная нода пропадёт надолго);
#   "telegram-bot@alfred:standby:prio=70" — с явным приоритетом.
# Переносимые настройки инстанса живут в instances/telegram-bot.<имя>.toml
# рядом с этим файлом и реплицируются по рою (см. пример
# instances/telegram-bot.example.toml в репозитории).
[node]
#id = "alfred"
kind = "server"                    # server | workstation | vps
# По умолчанию (не задано) — power-кнопки (⏻ выключить/🔃 перезагрузить/
# 🌙 усыпить) доступны только у workstation: kind server/vps — always_on,
# недоступность там авария, поэтому добровольный увод в офлайн по умолчанию
# не предлагается. Явный true включает кнопки и на always_on-машине —
# годится для домашнего сервера (стоит физически рядом, кнопку питания при
# нужде нажмут руками), но НЕ для удалённого VDS без такой возможности.
#power_controllable = true
socket = "./data/node.sock"
#listen = ["tcp://0.0.0.0:8710"]        # дома за NAT; требует [swarm].token
#listen = "tcp://<tailscale-ip>:8710"   # публичная машина: только явные адреса
#listen = ["tcp://<tailscale-ip>:8710", "tcp://<lan-ip>:8710"]
assignments = ["monitor", "apps", "torrents", "telegram-bot@alfred"]
state_path = "./data/node-state.json"
restart_delay_s = 5.0              # пауза перед перезапуском упавшей службы
stop_timeout_s = 90.0              # SIGTERM → SIGKILL при остановке

# Общие параметры роя. token — общий секрет: обязателен для служб на
# TCP-endpoint'ах (Windows-нода, межнодовый канал), unix-сокеты его не требуют.
# Сгенерировать: `python3 -c "import secrets; print(secrets.token_urlsafe(32))"`.
# Один и тот же токен должен стоять на всех нодах роя.
#
# node_down_alert_after_s — сколько нода, обязанная быть в сети (kind server
# или vps), может молчать, прежде чем рой сочтёт это аварией и пришлёт
# node_down. Спящая рабочая станция под это правило не подпадает вовсе.
# failover_grace_s — сколько резерв ждёт, прежде чем перенять службу-синглтон
# у пропавшей основной ноды. Меньше — служба скачет по рою на каждом моргании
# сети, больше — бот дольше молчит после настоящей аварии.
[swarm]
token = ""
node_down_alert_after_s = 300.0
failover_grace_s = 120.0

# join — endpoint ОДНОЙ уже существующей ноды роя: заполняется ТОЛЬКО при
# установке новой ноды (пусто = не присоединяться). При первом старте нода
# один раз запросит у него полный список пиров и свяжется со всеми напрямую
# («один seed → полный mesh»); дальше рой сам разъедется (третьи узлы
# узнают о новичке через ретрансляцию события node_joined). При следующих
# рестартах join не повторяется — список пиров уже сохранён (node-state.json).
# То же самое можно сделать вручную с уже работающей ноды: `nodectl join
# tcp://<сосед>:8710`. Замена ручной правки [[swarm.nodes]] на каждой ноде.
#join = "tcp://alfred.tailXXXXXX.ts.net:8710"

# Удалённые ноды роя (совместимость — статический список продолжает
# работать наравне с join; можно использовать любой способ или оба сразу).
# id — hostname ноды (dst.node в конверте), endpoint — её сервис ноды.
# Запрос к чужой ноде шлётся своей ноде, та пересылает сама («спроси любого»);
# свой id в списке игнорируется — конфиг роя можно держать общим.
#[[swarm.nodes]]
#id = "winpc"
#endpoint = "tcp://winpc.tailXXXXXX.ts.net:8710"

# Маячок в локальной сети: ноды находят друг друга сами, без join и без
# [[swarm.nodes]] — и сами переезжают, когда DHCP выдал соседу новый адрес.
# Запрос уходит broadcast'ом, ответ приходит unicast'ом, оба подписаны
# HMAC'ом от [swarm].token — сам токен в эфир не выходит, а пакет с чужой
# подписью нода молча дропает (снаружи порт неотличим от закрытого).
# Broadcast живёт только в своём сегменте сети: ноды вне локалки (VDS)
# по-прежнему добавляются через join или [[swarm.nodes]].
# Порт 32167 не занят IANA и лежит ниже эфемерного диапазона Linux.
# Интервалы: idle — фон спокойного роя, active — пока пиров нет или кто-то
# из них недоступен, то есть ровно тогда, когда сосед и ищется.
[swarm.discovery]
enabled = true
port = 32167
idle_interval_s = 300.0
active_interval_s = 15.0

# Wake-on-LAN: /wake шлёт magic packet на MAC машины в локальной сети.
# На стороне Windows должно быть включено: WoL в BIOS/UEFI, «Wake on Magic Packet»
# в свойствах сетевого адаптера, и выключен «быстрый запуск» (Fast Startup).
[wake]
mac = ""                           # пусто = функция выключена, напр. "AA:BB:CC:DD:EE:FF"
ip = ""                            # опционально: если задан, /wake проверит ping до и после
broadcast = "255.255.255.255"      # broadcast-адрес подсети, напр. "192.168.0.255"
port = 9                           # стандартный порт WoL (7 или 9)
wait_timeout_s = 120.0             # сколько ждать ответа на ping после пробуждения

[logging]
level = "INFO"
format = "plain"                   # plain | json

# --- Подписки (тихих часов нет) ---

# Типы событий: overheat_started, overheat_cleared (температура),
#               smart_degraded, smart_recovered (SMART-здоровье дисков),
#               system (старт/останов/восстановление связи). "*" = все.

# allowed_commands: имена команд бота (nodes, status, wake, ...) и права на
# динамические действия служб в форме "действие@служба" (из describe):
#   <id>@apps (qbittorrent@apps, ...) — скилл-приложение: команда в меню бота;
#   start@apps / stop@apps / restart@apps — реальное управление юнитом
#   приложения (кнопки на карточке; нужны права на машине — nodectl fix);
#   add@torrents — прислать .torrent-файл/magnet-ссылку в чат: бот спросит,
#   в какую директорию сохранить (кнопки из torrents.save_dirs);
#   list@torrents — read-only «что сейчас качается»;
#   search@net — веб-поиск через свой SearXNG;
#   start@node / stop@node / restart@node — управление службой на её карточке;
#   restart_node@node — перезапуск самой ноды-супервизора (не путать с restart
#   службы); poweroff/reboot/suspend@node / check_update@node / update@node —
#   питание и самообновление машины. Право не зависит от того, чья это
#   физически нода (ARCHITECTURE §11 п. 1) — работает одинаково и на своей
#   карточке, и на карточке любого пира.
# Голое имя действия (scan_now) даёт и текстовую команду, и кнопку у любой службы.
# Групповые права — не перечислять каждое действие по имени:
#   "*@node" — ЛЮБОЕ действие службы node, включая новые (появившиеся после
#   правки этого конфига) — новое умение на службе сразу доступно, без
#   рестарта ради добавления строчки, тот же принцип, что у динамического UI;
#   голый "*" — вообще любая команда/действие всех служб (полный доступ, для
#   доверенного админского чата).
# ЭТИ ЖЕ права ограничивают Альфреда (/ai): инструменты, которыми он может
# пользоваться в разговоре с конкретным собеседником, собираются по ЕГО
# подписке — Альфред не может больше, чем сам пользователь, и не «отказывает»,
# а честно не умеет (инструмента просто нет). Подробности и таблица тулов —
# AUTHORIZATION.md §3.4. Практически: без "status"/"nodes" Альфред не
# расскажет про состояние машин, без "list@torrents" — про закачки, без
# "search@net" — не полезет в интернет.
[[subscriptions]]
name = "me"
chat_id = 123456789
event_types = ["*"]                # всё: перегрев + SMART + система
allowed_commands = ["*"]           # админ — полный доступ ко всем командам/действиям

# Приватный вход (AUTHORIZATION.md §10). Чат, которого нет в подписках, не
# получает от бота НИЧЕГО — ни ответа, ни отказа: единственное, что он может
# сделать, это прислать одноразовый код приглашения. Коды выпускает /invite
# (право "invite"; у админского "*" оно уже есть), список и отзыв — /guests.
#
# Впущенный гость записывается в отдельный пакет
# instances/telegram-bot.<инстанс>.guests.toml — его ведёт сам бот, и он
# реплицируется по рою, поэтому гости переживают переезд бота на резервную
# ноду. Без пакета инстанса (бот запущен без --instance) приглашения не
# работают: записать гостя было бы некуда.
[invites]
enabled = true
ttl_s = 86400.0                    # сколько живёт выпущенный код (24 часа)
max_attempts_per_hour = 5          # потолок попыток подбора из одного чата
# Что именно получает гость. По умолчанию — разговор с Альфредом, память о
# себе и веб-поиск: инструменты Альфреда фильтруются подпиской (§3.4), поэтому
# ни рой, ни закачки гость не увидит.
grant_commands = ["chat@llm", "recall@memory", "remember@memory", "search@net"]
grant_events = []                  # алерты о температуре дисков гостю ни к чему
# Сознательно НЕ в списке: "tell@llm" — умение Альфреда передать сообщение
# другому человеку в личку («скажи Андрею, что…»). Впустить поговорить не то
# же самое, что разрешить писать другим людям от чужого имени; кому нужно —
# добавьте это право его подписке отдельно (AUTHORIZATION.md §3.4).
# Тоже НЕ в списке: доступ к /vpn — реальный ресурс с ценой трафика, не
# давать его молча каждому гостю. Хотите выдавать сразу — допишите сюда
# "usage@vpn, issue@vpn, reissue@vpn, revoke@vpn, grant_extra@vpn,
# request_extra@vpn, apk@vpn".

[[subscriptions]]
name = "family_room"
chat_id = -1009999999
event_types = ["overheat_started", "overheat_cleared", "smart_degraded"]
allowed_commands = []

# Дебаг-канал: факт вызова инструмента Альфредом (get_weather, convert_currency,
# get_time, remind и любые будущие тулы) — только имя, без аргументов/результата,
# и из живого /ai, и из self-scheduled remind (служба tasks). См.
# bot/lifecycle.py::notify_tool_call. Присутствие этой подписки и есть
# "включённый дебаг" — отдельного тумблера в конфиге нет, добавили секцию —
# уведомления пошли, убрали — перестали. event_types=["*"] (например, у
# админской подписки выше) это событие НЕ подхватывает — только точное имя
# "alfred_tool_call" (живая находка 2026-07-27: вызов тула на каждой
# реплике иначе засорял бы личный чат админа).
[[subscriptions]]
name = "alfred_debug"
chat_id = -1000000000000
event_types = ["alfred_tool_call"]
allowed_commands = []

# Известные собеседники /ai (bot/ai_flow.py::_find_known_person) — по
# telegram_username (без "@") сопоставляет отправителя, telegram_id —
# фоллбэк для тех, чей username неизвестен. Даёт персонажу Альфреда точный
# возраст и местное время собеседника (bot/ai_flow.py::_known_person_note),
# без этого — не пытается угадывать. ФИО/дата рождения — персональные
# данные, ЭТОТ файл — только пример с вымышленными значениями, реальные
# впишите в свой gitignored config.toml.
[[people]]
telegram_username = "ivan"    # без "@"
telegram_id = 0                # 0 = не задан, матчим по username
full_name = "Иван Иванович Иванов"
gender = "m"                   # "m" | "f"
city = "Алматы"
timezone = "Asia/Almaty"       # IANA-имя; пусто — время не подмешиваем
birth_date = "1990-01-01"      # ISO YYYY-MM-DD; пусто — возраст неизвестен

[[people]]
telegram_username = ""         # username неизвестен — матчим по telegram_id
telegram_id = 100000001
full_name = "Мария Ивановна Иванова"
gender = "f"
city = "Москва"
timezone = "Europe/Moscow"
birth_date = ""
