# Пример ПАКЕТА НАСТРОЕК ИНСТАНСА службы telegram-bot.
#
# Скопируйте рядом с вашим config.toml как instances/telegram-bot.<имя>.toml
# (имя инстанса берётся из имени файла — служебных полей внутри нет) и укажите
# ноде назначение с этим инстансом:
#
#   [node]
#   assignments = ["telegram-bot@alfred"]              # активная нода
#   assignments = ["telegram-bot@alfred:standby"]      # резервная нода
#
# Зачем это отдельный файл. Пакет — единица репликации: ноды, несущие один и
# тот же инстанс (активная и резервная), держат его одинаковым автоматически.
# Правка на любой из них поднимает ревизию (сайдкар telegram-bot.<имя>.rev.json
# рядом — его ведёт нода, руками не трогать) и разъезжается по рою; резерв
# подтягивает её, даже если в момент правки был выключен. Реплицируются байты
# файла целиком, поэтому комментарии и форматирование сохраняются.
#
# Инстансов может быть несколько: разные боты = разные токены = разные пакеты,
# у каждого своя пара активная/резервная нода.
#
# Приоритет источников: переменные окружения > этот пакет > общий config.toml.
# Секции ниже здесь и должны жить — копии в config.toml проиграют и вызовут
# предупреждение в логе.
#
# ФАЙЛ СОДЕРЖИТ СЕКРЕТ (токен бота) и персональные данные — не коммитить.

[telegram]
token = "PUT-YOUR-BOT-TOKEN-HERE"

# Город для тула погоды в /ai — относится к этому боту, не к машине.
[weather]
city = ""

# Подписки: кому этот бот шлёт события и что разрешено. Формат и права —
# полностью как в config.toml (см. AUTHORIZATION.md).
[[subscriptions]]
name = "me"
chat_id = 123456789
event_types = ["*"]
allowed_commands = ["*"]

# Приватный вход (AUTHORIZATION.md §10): что получает тот, кто погасил код
# приглашения. Сам список гостей здесь НЕ живёт — он в файле-спутнике
# instances/telegram-bot.<имя>.guests.toml, который ведёт бот и перезаписывает
# целиком (реплицируется так же, как этот пакет, поэтому гости переживают
# переезд бота на резерв).
#[invites]
#grant_commands = ["chat@llm", "recall@memory", "remember@memory"]
#grant_events = []

# Известные собеседники /ai — персональные данные живых людей.
#[[people]]
#telegram_username = "someone"
#full_name = "Имя Фамилия"
#gender = "m"
#city = "Бухарест"
#timezone = "Europe/Bucharest"
#birth_date = "1990-01-01"
