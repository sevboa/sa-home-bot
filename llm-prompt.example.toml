# Шаблон текста персонажа для службы llm (llm/service.py читает
# settings.llm.persona_prompt — см. config.py::_load_persona_prompt).
#
# Скопируйте этот файл в llm-prompt.toml РЯДОМ с вашим config.toml (тот же
# каталог, что и файл, переданный через --config) и впишите туда свой текст
# персонажа — тон, характер, конкретные правила и примеры реплик. И этот, и
# config.toml — gitignored, в репозиторий не попадают (намеренно: текст
# персонажа — личный, менять его в этом файле в git-историю не хочется).
#
# Единственный обязательный ключ — persona_prompt, многострочная TOML-
# строка. Если файла нет или ключ пуст — служба llm подставит безликую
# заглушку (llm/prompt.py::DEFAULT_PERSONA_PROMPT) и запишет warning в лог.
persona_prompt = """
Ты — %ИМЯ%, %РОЛЬ%. Отвечай по-русски, в характере, кратко по умолчанию.
"""
