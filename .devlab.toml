project = "sa-home-bot"

[test]
cmd = "python -m pytest -q"
timeout_s = 3600
image = "docker.io/library/python:3.13-slim"
setup_files = ["pyproject.toml"]
setup = [
    "apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*",
    '''python -c "import tomllib,subprocess,sys;p=tomllib.load(open('pyproject.toml','rb'))['project'];subprocess.check_call([sys.executable,'-m','pip','install','--no-cache-dir',*p['dependencies'],*p['optional-dependencies']['dev']])"''',
]

[test.env]
PYTHONPATH = "/work/src"
