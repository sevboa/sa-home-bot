project = "sa-home-bot"

[test]
cmd = "python -m pytest -q"
timeout_s = 3600
image = "docker.io/library/python:3.13-slim"
setup_files = ["pyproject.toml"]
setup = [
    "apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*",
    '''python -c "import tomllib,subprocess,sys;p=tomllib.load(open('pyproject.toml','rb'))['project'];subprocess.check_call([sys.executable,'-m','pip','install','--no-cache-dir',*p['dependencies'],*p['optional-dependencies']['dev'],*p['optional-dependencies']['mcp']])"''',
]

[test.env]
PYTHONPATH = "/work/src"

[agent]
rules = ["CLAUDE.md"]
checks = [
    "ruff check src tests",
    "python -m pytest -q tests/unit/test_no_comments_in_code.py",
]
allowed_commands = [
    "ruff check",
    "ruff format",
    "python -m pytest",
    "git diff",
    "git status",
]
forbidden_paths = [".devlab.toml", "CLAUDE.md", "pyproject.toml", "deploy/"]
secret_paths = [".env", "config.toml", "config.toml.*", "instances/*", "*.sqlite", "data/"]
diff_prefixes = ["src/", "tests/"]
