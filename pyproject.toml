[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-home-bot"
version = "0.112.16"
description = "Рой домашних машин: нода-супервизор, службы (мониторинг, приложения) и Telegram-бот"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sevboa", email = "sevboa@gmail.com" }]
dependencies = [
    "aiogram>=3.30,<4",
    "aiohttp-socks>=0.9,<1",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.19",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "qbittorrent-api>=2024.1.58",
    "segno>=1.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Windows-нода: pythonnet для LibreHardwareMonitorLib.dll (sensors/lhm.py).
# Установка: pipx install "sa-home-bot[windows] @ git+https://…@vX.Y.Z"
windows = [
    "pythonnet>=3.0; sys_platform == 'win32'",
]
# Нода с распознаванием голосовых /ai (сейчас mycraft — сильный CPU, Xeon
# E5-2678 v3): faster-whisper на CPU, не Ollama/Gemma (см. llm/stt.py).
# Установка: pipx install "sa-home-bot[stt] @ git+...@vX.Y.Z"
stt = [
    "faster-whisper>=1.0",
]
# Нода с синтезом голосовых ОТВЕТОВ /ai (сейчас mycraft, тот же CPU, что и
# stt): Coqui XTTS v2, voice cloning по референсному клипу (см. llm/tts.py).
# Требует ТРИ отдельных инфраструктурных шага помимо этого pip-пакета, ни
# один из них не покрывается extras-группой:
#   1. системный ffmpeg (apt install ffmpeg) — конвертация WAV -> OGG/Opus
#      для Telegram sendVoice, вызывается как внешний процесс, не биндинг;
#   2. переменная окружения COQUI_TOS_AGREED=1 в юните службы llm — иначе
#      первая загрузка весов XTTS v2 (лицензия CPML, некоммерческая)
#      зависнет на input() в неинтерактивном процессе;
#   3. референсный голос — WAV-файл 6-10с чистой речи по пути
#      settings.llm.tts_reference_voice_path (см. config.py), кладётся
#      вручную, не входит в репозиторий.
# transformers/torch — явные пины, не расчёт на резолвер: coqui-tts 0.27.5
# объявляет только "transformers>=4.57" и "torch>=2.2" без верхних границ
# (живая находка при деплое 2026-08-11) — pip тянет transformers 5.x (убрал
# isin_mps_friendly из pytorch_utils, ломает импорт TTS.api) и torch>=2.9
# (требует отдельно доустанавливать torchcodec для audio I/O — а тот, в свою
# очередь, на Debian trixie не совместим с системным ffmpeg 7.1/libavutil59:
# нет собранного бэкенда под эту версию). torch<2.9 обходит torchcodec
# целиком — coqui-tts грузит референсный WAV через классический
# torchaudio-бэкенд, никакого codec-экстра не нужно.
# Установка: pipx install "sa-home-bot[tts] @ git+...@vX.Y.Z"
tts = [
    "coqui-tts[cpu]>=0.27",
    "transformers>=4.57,<5",
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",
    # numpy — тоже явный пин: numba 0.66 (XTTS → librosa → numba) требует
    # numpy<2.5, а numpy 2.5.3 молча приехал в venv при переустановке и
    # сломал импорт TTS.api (живая находка 2026-09-24, "Numba needs NumPy
    # 2.4 or less").
    "numpy<2.5",
]
# Служба graph_memory (Этап 41, графовая память Альфреда): только на mycraft,
# там же живут Neo4j и Ollama. graphiti-core тянет за собой официальный
# neo4j-driver (протокол bolt бинарный, urllib его не осилит) — единственное
# осознанное исключение из принципа проекта "минимум зависимостей,
# urllib+to_thread", по аналогии с уже принятыми исключениями
# qbittorrent-api/pythonnet/coqui-tts (тяжёлая/специфичная зависимость,
# только на нужной ноде). Версии зафиксированы по факту пилота на mycraft
# 2026-09-22 (~/.venvs/graphiti): graphiti-core 0.30.2, neo4j 6.3.1.
# Установка: pipx install "sa-home-bot[graph_memory] @ git+...@vX.Y.Z"
# httpx — явный пин, не расчёт на резолвер: graphiti-core 0.30.2 сам
# импортирует классический httpx (graphiti_core/llm_client/client.py), но в
# своих метаданных его не объявляет (пакует только новый openai>=... который
# тянет httpx2, форк-переименование от той же команды, а не совместимую
# замену) — живая находка пилота 2026-09-22, без явного пина импорт падает
# с ModuleNotFoundError.
graph_memory = [
    "graphiti-core>=0.30.2,<0.31",
    "neo4j>=6.3.1,<7",
    "httpx>=0.28,<1",
]
# MCP-сервер умений роя для будущего агента (Этап 42.4, вторая попытка —
# первая версия жила на alfred как HTTP+bearer-токены, неправильная форма,
# см. IMPLEMENTATION_PLAN.md; src/sa_home_bot/agent/mcp_tools.py): базовая
# инфраструктура под агент-фреймворк (Phase 2 плана vast-skipping-crane.md),
# ещё не сам агент. Ставится на ноду, где будет жить агент — сейчас mycraft
# (там же Ollama), НЕ alfred: bot.tools переиспользуется как чистый Python
# через собственный node_link процесса, живые Telegram-объекты бота (notifier/
# store) не нужны вовсе, см. докстринг agent/mcp_tools.py. Официальный SDK, не
# самописный JSON-RPC — второе осознанное исключение из принципа
# "минимум зависимостей" после graphiti-core выше (пользователь явно выбрал
# официальный SDK вместо ручной реализации, решение 2026-09-23). Транспорт —
# stdio (mcp.server.stdio), не HTTP: агент и этот процесс — одна машина,
# доверие = общий процесс/оператор, сети и auth-слоя не нужно.
# Установка: pipx install "sa-home-bot[mcp] @ git+...@vX.Y.Z"
mcp = [
    "mcp>=2.2,<3",
]

[project.scripts]
sa-home-bot = "sa_home_bot.cli:main"
nodectl = "sa_home_bot.nodectl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sa_home_bot = ["db/schema.sql", "llm/model-profiles.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
