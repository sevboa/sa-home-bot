[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-home-bot"
version = "0.149.0"
description = "Рой домашних машин: нода-супервизор, службы (мониторинг, приложения) и Telegram-бот"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sevboa", email = "sevboa@gmail.com" }]
dependencies = [
    "aiogram>=3.30,<4",
    "aiohttp-socks>=0.9,<1",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.19",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "qbittorrent-api>=2024.1.58",
    "segno>=1.6",
    "pillow>=10.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
windows = [
    "pythonnet>=3.0; sys_platform == 'win32'",
]
stt = [
    "faster-whisper>=1.0",
    "av<19",
]
tts = [
    "coqui-tts[cpu]>=0.27",
    "transformers>=4.57,<5",
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",
    "numpy<2.5",
]
graph_memory = [
    "graphiti-core>=0.30.2,<0.31",
    "neo4j>=6.3.1,<7",
    "httpx>=0.28,<1",
]
mcp = [
    "mcp>=2.2,<3",
]

imagegen = [
    "diffusers>=0.35,<0.36",
    "peft>=0.17,<0.18",
    "accelerate>=1.10,<2",
    "torch>=2.2,<2.9",
    "transformers>=4.57,<5",
    "numpy<2.5",
    "rembg>=2.0.85,<2.1",
    "onnxruntime>=1.23,<2",
    "compel>=2.1.1,<2.2",
]

[project.scripts]
sa-home-bot = "sa_home_bot.cli:main"
nodectl = "sa_home_bot.nodectl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sa_home_bot = ["db/schema.sql", "llm/model-profiles.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
