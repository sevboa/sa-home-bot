[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-home-bot"
version = "0.96.0"
description = "Рой домашних машин: нода-супервизор, службы (мониторинг, приложения) и Telegram-бот"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sevboa", email = "sevboa@gmail.com" }]
dependencies = [
    "aiogram>=3.30,<4",
    "aiohttp-socks>=0.9,<1",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.19",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "qbittorrent-api>=2024.1.58",
    "segno>=1.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Windows-нода: pythonnet для LibreHardwareMonitorLib.dll (sensors/lhm.py).
# Установка: pipx install "sa-home-bot[windows] @ git+https://…@vX.Y.Z"
windows = [
    "pythonnet>=3.0; sys_platform == 'win32'",
]
# Нода с распознаванием голосовых /ai (сейчас mycraft — сильный CPU, Xeon
# E5-2678 v3): faster-whisper на CPU, не Ollama/Gemma (см. llm/stt.py).
# Установка: pipx install "sa-home-bot[stt] @ git+...@vX.Y.Z"
stt = [
    "faster-whisper>=1.0",
]
# Нода с синтезом голосовых ОТВЕТОВ /ai (сейчас mycraft, тот же CPU, что и
# stt): Coqui XTTS v2, voice cloning по референсному клипу (см. llm/tts.py).
# Требует ТРИ отдельных инфраструктурных шага помимо этого pip-пакета, ни
# один из них не покрывается extras-группой:
#   1. системный ffmpeg (apt install ffmpeg) — конвертация WAV -> OGG/Opus
#      для Telegram sendVoice, вызывается как внешний процесс, не биндинг;
#   2. переменная окружения COQUI_TOS_AGREED=1 в юните службы llm — иначе
#      первая загрузка весов XTTS v2 (лицензия CPML, некоммерческая)
#      зависнет на input() в неинтерактивном процессе;
#   3. референсный голос — WAV-файл 6-10с чистой речи по пути
#      settings.llm.tts_reference_voice_path (см. config.py), кладётся
#      вручную, не входит в репозиторий.
# transformers/torch — явные пины, не расчёт на резолвер: coqui-tts 0.27.5
# объявляет только "transformers>=4.57" и "torch>=2.2" без верхних границ
# (живая находка при деплое 2026-08-11) — pip тянет transformers 5.x (убрал
# isin_mps_friendly из pytorch_utils, ломает импорт TTS.api) и torch>=2.9
# (требует отдельно доустанавливать torchcodec для audio I/O — а тот, в свою
# очередь, на Debian trixie не совместим с системным ffmpeg 7.1/libavutil59:
# нет собранного бэкенда под эту версию). torch<2.9 обходит torchcodec
# целиком — coqui-tts грузит референсный WAV через классический
# torchaudio-бэкенд, никакого codec-экстра не нужно.
# Установка: pipx install "sa-home-bot[tts] @ git+...@vX.Y.Z"
tts = [
    "coqui-tts[cpu]>=0.27",
    "transformers>=4.57,<5",
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",
]

[project.scripts]
sa-home-bot = "sa_home_bot.cli:main"
nodectl = "sa_home_bot.nodectl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sa_home_bot = ["db/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
