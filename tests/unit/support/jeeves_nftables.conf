#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	counter mtg_bytes { }
	counter socks_bytes { }
	chain input {
		type filter hook input priority filter; policy drop;
		tcp dport 443 counter name mtg_bytes accept
		iifname "tailscale0" tcp dport 1080 counter name socks_bytes accept

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		iifname "tailscale0" accept
		udp dport 41641 accept
		udp dport 51820 accept
		udp dport 8443 accept	# AmneziaWG 2.0 awg1 (sa-home vpn, 2026-11-14)
		tcp dport 8443 accept	# xray VLESS+Reality (sa-home vpn, 2026-09-18)
		tcp dport 2083 accept	# xray Reality второй вход reality-alt (sa-home vpn, 2026-11-10)
		tcp dport 2087 accept	# xray Reality третий вход reality-xhttp (sa-home vpn, 2026-11-21)
		tcp dport 80 accept
		tcp dport 8444 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "awg0" accept
		oifname "awg0" accept
		iifname "awg1" accept
		oifname "awg1" accept
		iifname "vprobe-veth0" accept
		oifname "vprobe-veth0" accept
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
